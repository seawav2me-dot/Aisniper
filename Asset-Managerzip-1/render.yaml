services:
  - type: web
    name: aisniper-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_WEBHOOK
        value: "false"
      - key: AUTO_MIGRATE
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: APP_LINK
        sync: false
      - key: BOT_USERNAME
        value: Strongsmartsignal_bot
