services:
  - type: web
    name: aisniper-api
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: USE_WEBHOOK
        value: "false"
      - key: AUTO_MIGRATE
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: APP_LINK
        sync: false
      - key: BOT_USERNAME
        value: Strongsmartsignal_bot
      - key: API_KEY
        sync: false

  - type: cron
    name: aisniper-keepalive
    env: node
    schedule: "*/10 * * * *"
    buildCommand: echo "keepalive"
    startCommand: >
      node -e "
        const url = process.env.HEALTH_URL;
        if (!url) { console.log('HEALTH_URL not set'); process.exit(0); }
        fetch(url).then(r => console.log('ping ok', r.status)).catch(e => console.error('ping fail', e.message));
      "
    envVars:
      - key: HEALTH_URL
        value: https://aisniper-api.onrender.com/api/health
